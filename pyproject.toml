[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Replay-driven evaluation harness for a cost-tiered proposer/reviewer agent cascade"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jesse Anders" }]
keywords = ["llm", "agents", "evaluation", "replay", "regression-testing"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bedrock = ["boto3>=1.34"]

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
